<header class="header">
  <div class="header-left">
    <!-- Mobile Hamburger Toggle -->
    <button class="mobile-menu-btn" (click)="toggleSidebar.emit()" aria-label="Open navigation menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <!-- Mobile-only Brand Mark -->
    <div class="mobile-brand">
      <img src="/nexus-logo.png" alt="Nexus IDP" class="mobile-logo" />
      <span class="mobile-title">Nexus</span>
    </div>

    <!-- Desktop Cluster Status Chip -->
    <div class="cluster-chip">
      <span class="status-indicator"></span>
      <span class="region-code">{{ activeRegion() }}</span>
      <span class="sla-text">{{ clusterStatus() }}</span>
    </div>
  </div>

  <div class="header-right">
    <!-- Desktop Search Field -->
    <div class="search-field">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" placeholder="Search clusters, envs, services... (⌘K)" />
    </div>

    <!-- Mobile Search Icon Button -->
    <button class="mobile-search-btn" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>

    <!-- User Profile Dropdown Capsule -->
    <div class="profile-capsule">
      <div class="avatar">{{ currentUser().avatar }}</div>
      <div class="user-meta">
        <span class="name">{{ currentUser().name }}</span>
        <span class="role">{{ currentUser().role }}</span>
      </div>
    </div>
  </div>
</header>
