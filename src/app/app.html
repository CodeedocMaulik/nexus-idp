<main class="shell-container">
  <header class="header">
    <h1>{{ appTitle() }}</h1>
    <p>Enterprise Self-Service Infrastructure & Environments</p>
  </header>

  <section class="services-section">
    <h2>Platform Core Modules</h2>

    <!-- Modern Built-in Control Flow (@for) -->
    <div class="grid">
      @for (service of coreServices(); track service.id) {
        <div class="card" [class]="service.status.toLowerCase()">
          <span class="badge">{{ service.status }}</span>
          <h3>{{ service.name }}</h3>
          <small>ID: {{ service.id }}</small>
        </div>
      } @empty {
        <p>No services registered yet.</p>
      }
    </div>
  </section>

  <!-- Router outlet where child routes will render -->
  <router-outlet />
</main>
